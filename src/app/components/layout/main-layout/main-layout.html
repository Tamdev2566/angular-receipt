<div class="d-flex vw-100 vh-100 overflow-hidden bg-argon-layout position-relative">
  <div
    class="position-absolute top-0 start-0 w-100 argon-banner"
    style="height: 320px; z-index: 1"
  ></div>

  <div *ngIf="isSidebarOpen" class="sidebar-overlay d-md-none" (click)="toggleSidebar()"></div>

  <div
    class="h-100 flex-shrink-0 p-3 position-relative sidebar-container"
    [ngClass]="{ 'modal-active': (stateService.modalState$ | async) }"
    [class.active]="isSidebarOpen"
    [class.receipt-blur]="showReceiptModal"
  >
    <app-sidebar class="h-100"></app-sidebar>
  </div>

  <div
    class="d-flex flex-column flex-grow-1 h-100 overflow-hidden position-relative"
    style="z-index: 10"
    [class.receipt-blur]="showReceiptModal"
  >
    <header class="w-100 d-flex align-items-center px-3 header-navbar-wrapper">
      <button class="btn btn-light me-2 custom-hamburger-nav" (click)="toggleSidebar()">
        <i class="fa" [ngClass]="isSidebarOpen ? 'fa-times' : 'fa-bars'"></i>
      </button>

      <app-navbar class="flex-grow-1" (logoutTriggered)="handleGlobalLogout()"></app-navbar>
    </header>

    <main
      class="flex-grow-1 px-4 pb-4 me-0 mb-0 me-md-3 mb-md-3 dashboard-main-view rounded-3 shadow-sm"
      style="background-color: #e5eef3; overflow-y: auto"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
