<div class="user-management-flat-wrapper animate-fade-in">
  <!-- Header -->
  <div class="page-header-section mt-3">
    <h4 class="text-white m-0 fw-bold">Cheque Reader Information</h4>

    <div class="d-flex justify-content-between gap-3">
      <button
        class="btn btn-flat-action-primary"
        (click)="onSave()"
        [disabled]="!isSaveAllowed"
        [class.disabled-btn]="!isSaveAllowed"
      >
        <i class="fa-solid fa-floppy-disk me-1"></i>
        Save
      </button>

      <button class="btn btn-flat-action-danger-outline" (click)="onCancel()">Cancel</button>
    </div>
  </div>

  <div class="main-scrollable-content-fluid">
    <div class="receipt-form-card">
      <div class="row g-4">
        <!-- Radio Buttons (Direction) -->
        <div class="col-12">
          <label class="form-label custom-flat-label mb-2">
            Direction <span class="text-danger">*</span>
          </label>
          <div class="d-flex flex-wrap align-items-center gap-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="inbound"
                name="direction"
                value="INBOUND"
                [(ngModel)]="formData.direction"
                (ngModelChange)="validateForm()"
              />
              <label class="form-check-label" for="inbound"> Inbound </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="outbound"
                name="direction"
                value="OUTBOUND"
                [(ngModel)]="formData.direction"
                (ngModelChange)="validateForm()"
              />
              <label class="form-check-label" for="outbound"> Outbound </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="both"
                name="direction"
                value="BOTH"
                [(ngModel)]="formData.direction"
                (ngModelChange)="validateForm()"
              />
              <label class="form-check-label" for="both"> Inbound & Outbound </label>
            </div>
          </div>
          <div
            *ngIf="errors['direction'] && isSubmitted"
            class="text-danger mt-1"
            style="font-size: 0.72rem; font-weight: 600"
          >
            Direction is required
          </div>
        </div>

        <!-- Date (Optional - No validation) -->
        <div class="col-md-3">
          <label class="form-label custom-flat-label"> Date </label>
          <input
            type="text"
            readonly
            class="form-control custom-flat-input input-readonly-flat"
            [(ngModel)]="formData.date"
          />
        </div>

        <!-- Full Cheque -->
        <div class="col-md-3">
          <label class="form-label custom-flat-label">
            Full Cheque <span class="text-danger">*</span>
          </label>

          <input
            type="text"
            class="form-control custom-flat-input"
            [class.is-invalid]="errors['fullCheque'] && isSubmitted"
            placeholder="Enter Full Cheque"
            [(ngModel)]="formData.fullCheque"
            (ngModelChange)="validateFullCheque()"
          />

          <div
            *ngIf="errors['fullCheque'] && isSubmitted"
            class="invalid-feedback d-flex align-items-center mt-1"
            style="font-size: 0.72rem; font-weight: 600"
          >
            Full Cheque is required
          </div>
        </div>

        <!-- Cheque -->
        <div class="col-md-3">
          <label class="form-label custom-flat-label">
            Cheque <span class="text-danger">*</span>
          </label>

          <input
            type="text"
            class="form-control custom-flat-input"
            [class.is-invalid]="errors['cheque'] && isSubmitted"
            placeholder="Enter Cheque (e.g. SCB 100200)"
            [(ngModel)]="formData.cheque"
            name="cheque"
            (ngModelChange)="validateCheque()"
          />

          <div
            *ngIf="errors['cheque'] && isSubmitted"
            class="invalid-feedback d-flex align-items-center mt-1"
            style="font-size: 0.72rem; font-weight: 600"
          >
            {{ chequeErrorMessage || 'Cheque is required' }}
          </div>
        </div>

        <!-- Bank -->
        <div class="col-md-3">
          <label class="form-label custom-flat-label">
            Bank <span class="text-danger">*</span>
          </label>

          <input
            type="text"
            class="form-control custom-flat-input"
            [class.is-invalid]="errors['bank'] && isSubmitted"
            placeholder="Enter Bank"
            [(ngModel)]="formData.bank"
            (ngModelChange)="validateBank()"
          />

          <div
            *ngIf="errors['bank'] && isSubmitted"
            class="invalid-feedback d-flex align-items-center mt-1"
            style="font-size: 0.72rem; font-weight: 600"
          >
            Bank is required
          </div>
        </div>
      </div>
    </div>

    <div class="receipt-form-card mt-3">
      <app-data-grid
        [records]="gridData"
        [columns]="gridColumns"
        [showAction]="true"
        [tableHeight]="'calc(100vh - 500px)'"
        [actionTemplate]="availableAction"
      >
      </app-data-grid>

      <ng-template #availableAction let-row>
        <app-icon-button
          iconClass="bi bi-pencil-fill"
          colorClass="color-info"
          title="View"
          [customStyle]="{ 'margin-right': '8px' }"
          (onClick)="viewDetails(row)"
        >
        </app-icon-button>
        <app-icon-button
          [iconClass]="row.isValid === '1' ? 'bi bi-toggle-on' : 'bi bi-toggle-off'"
          [colorClass]="row.isValid === '1' ? 'text-success' : 'text-danger'"
          [title]="row.isValid === '1' ? 'Deactivate' : 'Activate'"
          [customStyle]="{ 'margin-right': '8px' }"
          (onClick)="toggleStatus(row)"
        >
        </app-icon-button>
      </ng-template>
    </div>

    <!-- Custom Confirm Dialog -->
    <app-confirm-dialog
      *ngIf="showConfirmDialog"
      [title]="confirmTitle"
      [message]="confirmMessage"
      (yes)="onConfirmYes()"
      (no)="onConfirmNo()"
    >
    </app-confirm-dialog>
  </div>
</div>
