<!-- <div
  class="bg-light text-dark min-vh-screen d-flex flex-column"
  [class.modal-open-active]="showNewModal || showUndoModal || showRemoveModal"
  style="font-family: 'Open Sans', 'Inter', sans-serif; background-color: #f8f9fa !important"
>
  <div class="d-flex flex-grow-1 position-relative" style="min-height: calc(100vh - 80px)">
    <div
      class="flex-grow-1 d-flex flex-column bg-white rounded-4 m-3 p-4 shadow-sm border border-light overflow-hidden"
      style="min-height: 840px; justify-content: space-between"
    >
      <div>
        <header
          class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom border-light"
        >
          <h1 class="h4 fw-bold text-dark m-0 tracking-tight" style="color: #32325d !important">
            Receipts
          </h1>

          <button
            (click)="openNewReceiptModal()"
            class="btn text-white d-flex align-items-center gap-2 fw-bold px-4 border-0 shadow-sm transition-card"
            style="height: 38px; font-size: 0.75rem; background: #2dce89; border-radius: 0.5rem"
          >
            <svg
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>New Receipt</span>
          </button>
        </header>

        <div class="bg-light border rounded-3 p-3 mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label
                class="form-label text-muted text-uppercase fw-bold m-0 mb-1"
                style="font-size: 0.6rem"
                >From Date</label
              >
              <input
                type="date"
                [(ngModel)]="filterFromDate"
                class="form-control form-control-sm border-slate font-semibold"
                style="font-size: 0.75rem; height: 34px"
              />
            </div>
            <div class="col-md-3">
              <label
                class="form-label text-muted text-uppercase fw-bold m-0 mb-1"
                style="font-size: 0.6rem"
                >To Date</label
              >
              <input
                type="date"
                [(ngModel)]="filterToDate"
                class="form-control form-control-sm border-slate font-semibold"
                style="font-size: 0.75rem; height: 34px"
              />
            </div>
            <div class="col-md-3">
              <label
                class="form-label text-muted text-uppercase fw-bold m-0 mb-1"
                style="font-size: 0.6rem"
                >Invoice Number</label
              >
              <input
                type="text"
                [(ngModel)]="filterInvoice"
                placeholder="e.g. DI23003"
                class="form-control form-control-sm border-slate"
                style="font-size: 0.75rem; height: 34px"
              />
            </div>
            <div class="col-md-3">
              <div class="d-flex gap-2">
                <button
                  (click)="applyFilters()"
                  class="btn text-white btn-sm w-100 fw-bold text-uppercase d-flex align-items-center justify-content-center gap-1 border-0"
                  style="
                    height: 34px;
                    font-size: 0.65rem;
                    background-color: #172b4d;
                    border-radius: 0.375rem;
                  "
                >
                  Retrieve
                </button>
                <button
                  (click)="resetFilters()"
                  class="btn btn-outline-secondary btn-sm w-100 fw-bold text-uppercase d-flex align-items-center justify-content-center gap-1"
                  style="
                    height: 34px;
                    font-size: 0.65rem;
                    border-color: #cbd5e1;
                    border-radius: 0.375rem;
                    color: #525f7f;
                  "
                >
                  Reset
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          *ngIf="toastVisible"
          class="position-fixed bottom-0 end-0 m-4 z-3 bg-dark text-white p-2.5 px-4 rounded-3 shadow-lg d-flex align-items-center gap-2 border border-secondary animate-toast"
          style="font-size: 0.7rem"
        >
          <div
            class="spinner-grow text-success"
            style="width: 8px; height: 8px"
            role="status"
          ></div>
          <span class="fw-bold">{{ toastText }}</span>
        </div>

        <div
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 align-content-start"
          *ngIf="paginatedRecords.length > 0"
        >
          <div class="col" *ngFor="let item of paginatedRecords">
            <div
              class="card h-100 border border-slate rounded-3 shadow-none transition-card"
              style="background-color: #ffffff"
            >
              <div
                class="card-body p-3.5 d-flex flex-column justify-content-between"
                style="min-height: 225px; gap: 12px"
              >
                <div class="d-flex justify-content-between align-items-start">
                  <div class="d-flex align-items-center gap-2.5">
                    <div
                      class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-uppercase"
                      style="
                        width: 34px;
                        height: 34px;
                        background-color: #fff0f5;
                        color: #ff1493;
                        font-size: 0.8rem;
                        shrink: 0;
                      "
                    >
                      {{ item.customerName.charAt(0).toUpperCase() }}
                    </div>
                    <div style="line-height: 1.2">
                      <h6
                        class="card-title fw-bold text-dark m-0 text-truncate"
                        style="max-width: 185px; font-size: 0.82rem; color: #32325d !important"
                      >
                        {{ item.customerName }}
                      </h6>
                      <small
                        class="text-muted font-monospace"
                        style="font-size: 0.62rem; color: #8898aa !important"
                        >INVOICE: {{ item.invoiceNo }}</small
                      >
                    </div>
                  </div>
                </div>

                <div
                  class="bg-light rounded p-2 d-flex flex-column gap-1.5"
                  style="font-size: 0.7rem; border: 1px solid #f1f5f9"
                >
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">Vessel / Voyage</span>
                    <span
                      class="fw-bold text-secondary text-truncate text-end max-w-160"
                      style="color: #525f7f !important"
                      >{{ item.vesselName }} ({{ item.voyageNo }})</span
                    >
                  </div>
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">BL Code</span>
                    <span
                      class="fw-bold text-secondary font-monospace text-end"
                      style="color: #525f7f !important"
                      >{{ item.blNo }}</span
                    >
                  </div>
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">Payment Ref</span>
                    <span class="fw-bold text-secondary text-end" style="color: #525f7f !important"
                      >{{ item.payMode }} - {{ item.chequeNo }}</span
                    >
                  </div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center pt-2 border-top border-light"
                >
                  <div>
                    <span
                      class="text-muted d-block text-uppercase fw-bold"
                      style="font-size: 0.55rem; tracking: 0.05em; line-height: 1"
                      >Total Amount</span
                    >
                    <span
                      class="fw-bold text-dark m-0"
                      style="color: #32325d !important; font-size: 1.05rem"
                    >
                      ${{ item.amount | number: '1.2-2' }}
                      <small class="text-muted fw-bold text-uppercase" style="font-size: 0.68rem">{{
                        item.currency
                      }}</small>
                    </span>
                  </div>
                  <div class="text-end" style="line-height: 1">
                    <span
                      class="text-muted d-block text-uppercase fw-bold"
                      style="font-size: 0.55rem; tracking: 0.05em"
                      >Ledger Date</span
                    >
                    <span
                      class="text-secondary fw-bold"
                      style="font-size: 0.7rem; color: #525f7f !important"
                      >{{ item.date }}</span
                    >
                  </div>
                </div>

                <div class="row g-2 pt-1.5 border-top border-light">
                  <div class="col-6">
                    <button
                      (click)="openUndoModal(item)"
                      class="btn btn-outline-secondary btn-sm w-100 fw-bold text-uppercase d-flex align-items-center justify-content-center gap-1 border-slate"
                      style="font-size: 0.62rem; padding: 5px 0; color: #525f7f; height: 30px"
                    >
                      Undo Verification
                    </button>
                  </div>
                  <div class="col-6">
                    <button
                      (click)="openRemoveModal(item)"
                      class="btn btn-outline-danger btn-sm w-100 fw-bold text-uppercase d-flex align-items-center justify-content-center gap-1"
                      style="
                        font-size: 0.62rem;
                        padding: 5px 0;
                        border-color: #f5365c;
                        color: #f5365c;
                        height: 30px;
                      "
                    >
                      Remove Invoice
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div
          *ngIf="paginatedRecords.length === 0"
          class="bg-white p-5 text-center my-5 d-flex flex-column align-items-center justify-content-center"
        >
          <div
            class="rounded-circle mx-auto d-flex align-items-center justify-content-center mb-2"
            style="width: 48px; height: 48px; background-color: #fceea7"
          >
            <svg
              class="text-warning"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </div>
          <h6 class="fw-bold text-dark m-0" style="color: #32325d !important">
            No Ledger Records Found
          </h6>
          <p class="text-muted mx-auto m-0 mt-1" style="max-width: 320px; font-size: 0.7rem">
            Modify your selectors or search criteria to query active receipts.
          </p>
        </div>
      </div>

      <div
        class="d-flex flex-column flex-sm-row justify-content-between align-items-center mt-4 border-top border-light pt-3 gap-2"
      >
        <div class="text-muted fw-bold" style="font-size: 0.68rem; color: #8898aa !important">
          Showing <span>{{ (currentPage - 1) * pageSize + 1 }}</span> to
          <span>{{
            currentPage * pageSize < filteredRecords.length
              ? currentPage * pageSize
              : filteredRecords.length
          }}</span>
          of <span>{{ filteredRecords.length }}</span> records
        </div>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm m-0 gap-6 align-items-center">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <button
                class="page-link px-3 border-slate text-secondary fw-bold bg-white cursor-pointer d-flex align-items-center justify-content-center transition-card"
                (click)="changePage(currentPage - 1)"
                style="
                  font-size: 0.72rem;
                  height: 34px;
                  min-width: 54px;
                  border-radius: 0.375rem;
                  color: #8898aa !important;
                  border-color: #dee2e6 !important;
                "
              >
                Prev
              </button>
            </li>

            <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index">
              <button
                class="page-link fw-bold d-flex align-items-center justify-content-center transition-card"
                [class.active-page]="currentPage === i + 1"
                (click)="changePage(i + 1)"
                style="
                  font-size: 0.72rem;
                  width: 34px;
                  height: 34px;
                  padding: 0;
                  border-radius: 0.375rem;
                  border: 1px solid #dee2e6;
                "
              >
                {{ i + 1 }}
              </button>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <button
                class="page-link px-3 border-slate text-dark fw-bold bg-white cursor-pointer d-flex align-items-center justify-content-center transition-card"
                (click)="changePage(currentPage + 1)"
                style="
                  font-size: 0.72rem;
                  height: 34px;
                  min-width: 54px;
                  border-radius: 0.375rem;
                  color: #2dce89 !important;
                  border-color: #dee2e6 !important;
                "
              >
                Next
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <app-undo-receipt
    *ngIf="showUndoModal"
    [record]="selectedRecord"
    [allRecords]="ledgerData"
    (close)="showUndoModal = false"
    (success)="handleToastNotification($event)"
  ></app-undo-receipt>
  <app-remove-receipt
    *ngIf="showRemoveModal"
    [record]="selectedRecord"
    [allRecords]="ledgerData"
    (close)="showRemoveModal = false"
    (success)="handleRemoval($event)"
  ></app-remove-receipt>
  <app-new-receipt
    *ngIf="showNewModal"
    (close)="showNewModal = false"
    (save)="handleSaveNewReceipt($event)"
  ></app-new-receipt>

  <footer
    class="bg-white border-top py-2.5 text-center text-muted fw-bold"
    style="font-size: 0.62rem; color: #8898aa !important; letter-spacing: 0.05em"
  >
    &copy; 2026 GLOSSYS LEDGER SYSTEMS. SINGAPORE PORT CLEARANCE TERMINAL AUTHORITY. ALL RIGHTS
    RESERVED.
  </footer>
</div> -->
