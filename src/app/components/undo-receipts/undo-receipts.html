<div class="container-fluid p-4">
  <fieldset class="border rounded-3 p-3 mb-4">
    <legend
      class="float-none w-auto px-2 fs-6 fw-bold text-secondary mb-0"
      style="font-size: 0.8rem !important; letter-spacing: 0.5px"
    >
      RETRIEVE BY
    </legend>

    <div class="row g-3 align-items-end mb-3">
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">Invoice Number :</label>
        <input type="text" class="form-control" [(ngModel)]="searchForm.invoiceNumber" />
      </div>
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">BL Number :</label>
        <input type="text" class="form-control" [(ngModel)]="searchForm.blNumber" />
      </div>
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">Cheque Number :</label>
        <input type="text" class="form-control" [(ngModel)]="searchForm.chequeNumber" />
      </div>
      <div class="col-md-3">
        <button class="btn btn-dark w-100 fw-bold" (click)="retrieveMatches()">
          Retrieve Matches
        </button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">BL Number :</label>
        <input
          type="text"
          class="form-control bg-light text-secondary opacity-75"
          [(ngModel)]="detailsForm.blNumber"
          readonly
        />
      </div>
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">Vessel Name :</label>
        <input
          type="text"
          class="form-control bg-light text-secondary opacity-75"
          [(ngModel)]="detailsForm.vesselName"
          readonly
        />
      </div>
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">Voyage Number :</label>
        <input
          type="text"
          class="form-control bg-light text-secondary opacity-75"
          [(ngModel)]="detailsForm.voyageNumber"
          readonly
        />
      </div>
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1">Customer Name :</label>
        <input
          type="text"
          class="form-control bg-light text-secondary opacity-75"
          [(ngModel)]="detailsForm.customerName"
          readonly
        />
      </div>
    </div>
  </fieldset>

  <fieldset class="border rounded-3 p-3 mb-4">
    <legend
      class="float-none w-auto px-2 fs-6 fw-bold text-secondary mb-0"
      style="font-size: 0.8rem !important; letter-spacing: 0.5px"
    >
      RECEIPT DETAILS
    </legend>
    <app-data-grid [records]="gridData" [columns]="gridColumns"></app-data-grid>
  </fieldset>

  <fieldset class="border rounded-3 p-3 mb-4">
    <legend
      class="float-none w-auto px-2 fs-6 fw-bold text-secondary mb-0"
      style="font-size: 0.8rem !important; letter-spacing: 0.5px"
    >
      INVOICE DETAILS
    </legend>
    <app-data-grid [records]="invoices" [columns]="invoiceColumns"></app-data-grid>
  </fieldset>

  <div class="d-flex justify-content-end mt-2">
    <button
      class="btn text-white fw-bold px-4"
      style="background-color: #33708f; border-color: #33708f"
      (click)="undoPayment()"
    >
      Undo Payment
    </button>
  </div>
</div>
