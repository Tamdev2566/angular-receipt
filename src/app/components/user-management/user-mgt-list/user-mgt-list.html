<div class="user-management-flat-wrapper animate-fade-in">
  <!-- INNER STRICT SCROLL CONTAINER FRAME -->
  <div class="main-scrollable-content-fluid p-4">
    <!-- Top Header Title Area -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom-flat pb-3">
      <div>
        <h4 class="text-header-title m-0 fw-bold">User Management</h4>
      </div>
      <div></div>
    </div>

    <!-- Action Toolbar (Buttons & Search Layout Matching Theme Rule) -->
    <div
      class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 px-3 py-2.5 rounded-2"
    >
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-flat-action-primary" (click)="onCreateNewUser()">
          <i class="fa-solid fa-plus small"></i> Create
        </button>

        <button
          class="btn btn-flat-action-secondary"
          [disabled]="!selectedRecord || selectedRecord.length > 0"
          (click)="openEditModal(selectedRecord)"
        >
          <i class="fa-solid fa-pencil small"></i> Update
        </button>

        <button class="btn btn-flat-action-secondary" (click)="toggleValidity()">
          <i class="fa-solid fa-arrows-rotate small"></i> Valid/Invalid
        </button>

        <button class="btn btn-flat-action-secondary btn-flat-active" (click)="filterAll()">
          <i class="fa-solid fa-check small"></i> ALL
        </button>

        <button class="btn btn-flat-action-secondary" (click)="printLedger()">
          <i class="fa-solid fa-print small"></i> Print
        </button>

        <button class="btn btn-flat-action-secondary" (click)="viewHistory()">
          <i class="fa-solid fa-history small"></i> History
        </button>
      </div>

      <!-- Search Section -->
      <div class="search-flat-wrapper d-flex align-items-center">
        <input
          type="text"
          placeholder="SEARCH..."
          class="search-flat-input"
          (input)="onSearch($event)"
          (keypress)="onKeyPress($event)"
        />
        <button class="btn-search-flat-go" (click)="searchUsers()">Go</button>
      </div>
    </div>

    <!-- Datatable Workspace Section -->
    <div class="container-fluid p-4 bg-light">
      <app-data-grid
        [records]="paginatedRecords"
        [columns]="tableHeaders"
        (selectionChange)="onRowSelect($event)"
      >
      </app-data-grid>
    </div>
  </div>
</div>

<app-loader *ngIf="isGlobalLoading" [isLoading]="isGlobalLoading"> </app-loader>
