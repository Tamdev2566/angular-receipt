<div class="user-management-flat-wrapper animate-fade-in">
  <!-- Header -->

  <div class="page-header-section mt-3">
    <h4 class="text-white m-0 fw-bold">Daily Scan Report</h4>

    <div class="d-flex justify-content-between gap-3">
      <button
        class="btn btn-flat-action-primary"
        (click)="generateReport()"
        [disabled]="!isAllowed"
        [class.disabled-btn]="!isAllowed"
      >
        <i class="bi bi-clipboard2-data-fill"></i>
        Generate Report
      </button>

      <button class="btn btn-flat-action-danger-outline" (click)="onCancel()">
        <i class="bi bi-arrow-clockwise"></i>
        Reset
      </button>
    </div>
  </div>

  <div class="main-scrollable-content-fluid p-4">
    <div class="receipt-form-card">
      <div class="row g-3">
        <!-- Reader Type -->

        <div class="col-12">
          <label class="form-label custom-flat-label"> Reader Type: </label>

          <div class="d-flex flex-wrap gap-4 mt-2">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="inbound"
                name="readerType"
                value="INBOUND"
                [(ngModel)]="formData.readerType"
              />

              <label class="form-check-label" for="inbound"> Inbound </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="outbound"
                name="readerType"
                value="OUTBOUND"
                [(ngModel)]="formData.readerType"
              />

              <label class="form-check-label" for="outbound"> Outbound </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="both"
                name="readerType"
                value="BOTH"
                [(ngModel)]="formData.readerType"
              />

              <label class="form-check-label" for="both"> Inbound & Outbound </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="all"
                name="readerType"
                value="ALL"
                [(ngModel)]="formData.readerType"
              />

              <label class="form-check-label" for="all"> All </label>
            </div>
          </div>
        </div>

        <!-- From Date -->
        <div class="col-md-3">
          <app-date-picker
            label="To Date"
            [(value)]="formData.fromDate"
            [required]="true"
            [error]="!formData.fromDate && isSubmitted"
            helperText="From date is required"
          >
          </app-date-picker>
        </div>

        <!-- To Date -->
        <div class="col-md-3">
          <app-date-picker
            label="To Date"
            [(value)]="formData.toDate"
            [required]="true"
            [error]="!formData.toDate && isSubmitted"
            helperText="To date is required"
          >
          </app-date-picker>
        </div>
      </div>
    </div>

    <!-- table -->
    <div class="receipt-form-card mt-3">
      <div class="col-12 d-flex justify-content-end">
        <button
          class="btn btn-flat-action-primary-fill mb-3"
          [disabled]="gridData.length <= 0"
          (click)="onDownloadClick()"
        >
          <i class="bi bi-cloud-arrow-down-fill"></i>
          Export to Excel
        </button>
      </div>

      <app-data-grid
        [records]="gridData"
        [columns]="gridColumns"
        [showAction]="false"
        [isServerSide]="true"
        [tableHeight]="'535px'"
      >
      </app-data-grid>
    </div>
  </div>
</div>
