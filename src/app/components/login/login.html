<div class="auth-wrapper">
  <div class="bg-blob-tr"></div>
  <div class="bg-blob-bl"></div>

  <div class="auth-card">
    <div class="panel-left illustration-panel">
      <div class="bg-texture"></div>

      <div class="left-content brand-text">
        <h2>Receipt Phase System</h2>
        <p>Welcome to the application</p>
      </div>
      <div class="financial-illustration">
        <div class="glow-coin coin-1"><span>$</span></div>
        <div class="glow-coin coin-2"><span>$</span></div>

        <div class="doc bank-doc">
          <div class="doc-header">BANK</div>
          <div class="doc-lines">
            <div class="line w-100"></div>
            <div class="line w-80"></div>
            <div class="line w-90"></div>
            <div class="line w-70"></div>
            <div class="line w-85"></div>
          </div>
        </div>

        <div class="doc invoice-doc">
          <div class="invoice-top">
            <div class="invoice-title">INVOICE</div>
            <div class="invoice-lines">
              <div class="line w-100"></div>
              <div class="line w-70"></div>
            </div>
          </div>
          <div class="invoice-table">
            <div class="table-header"></div>
            <div class="table-row"></div>
            <div class="table-row"></div>
            <div class="table-row"></div>
            <div class="table-row"></div>
          </div>
          <div class="invoice-total">
            <div class="total-box">TOTAL $65.40</div>
          </div>
        </div>

        <div class="doc receipt-doc">
          <div class="receipt-zigzag-top"></div>
          <div class="receipt-content">
            <div class="receipt-title">RECEIPT</div>
            <div class="line-group">
              <div class="line center w-60"></div>
              <div class="line center w-80"></div>
              <div class="line center w-50"></div>
            </div>
            <div class="dashed-divider"></div>
            <div class="line-group">
              <div class="line w-100"></div>
              <div class="line w-100"></div>
              <div class="line w-90"></div>
              <div class="line w-90"></div>
            </div>
            <div class="dashed-divider"></div>
            <div class="barcode">
              <div class="bar thick"></div>
              <div class="bar"></div>
              <div class="bar medium"></div>
              <div class="bar"></div>
              <div class="bar thick"></div>
              <div class="bar"></div>
              <div class="bar medium"></div>
              <div class="bar"></div>
              <div class="bar thick"></div>
            </div>
          </div>
          <div class="receipt-zigzag-bottom"></div>
        </div>

        <div class="credit-card">
          <div class="card-chip"></div>
          <div class="card-number"></div>
          <div class="card-details">
            <div class="card-line w-40"></div>
            <div class="card-line w-20"></div>
          </div>
        </div>
      </div>

      <div class="smoke-divider"></div>
    </div>

    <div class="panel-right form-panel">
      <div class="right-content form-container">
        <div class="form-header">
          <img
            src="asset/images/logo.png"
            alt="Samudera Logo"
            style="max-height: 55px"
            class="mb-2"
          />
          <p>Samudra Shipping Lines</p>
        </div>

        <form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)" autocomplete="off">
          <div
            class="input-group"
            [ngClass]="{ 'is-invalid': userId.invalid && (userId.touched || formSubmitted) }"
          >
            <svg class="input-icon" viewBox="0 0 24 24">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
            <input
              type="text"
              name="username"
              [(ngModel)]="username"
              #userId="ngModel"
              class="auth-input"
              placeholder="Username"
              required
              minlength="3"
            />
          </div>
          <span class="error-msg" *ngIf="userId.invalid && (userId.touched || formSubmitted)">
            <span *ngIf="userId.errors?.['required']">Username is required</span>
            <span *ngIf="userId.errors?.['minlength']">Minimum 3 characters needed</span>
          </span>

          <div
            class="input-group"
            [ngClass]="{
              'is-invalid': passwordField.invalid && (passwordField.touched || formSubmitted),
            }"
          >
            <svg class="input-icon" viewBox="0 0 24 24">
              <path
                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
              />
            </svg>
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              #passwordField="ngModel"
              class="auth-input"
              placeholder="Password"
              required
              minlength="6"
            />
            <button type="button" class="show-password-btn" (click)="togglePassword()">
              {{ showPassword ? 'HIDE' : 'SHOW' }}
            </button>
          </div>
          <span
            class="error-msg"
            *ngIf="passwordField.invalid && (passwordField.touched || formSubmitted)"
          >
            <span *ngIf="passwordField.errors?.['required']">Password is required</span>
            <span *ngIf="passwordField.errors?.['minlength']">Minimum 6 characters needed</span>
          </span>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              <span class="checkmark"></span>
              Remember
            </label>
            <a href="#" class="forgot-link" (click)="openForgotModal($event, 'forgot')"
              >Forgot Password ?</a
            >
          </div>

          <button type="submit" class="btn-login" [disabled]="isLoading">
            <ng-container *ngIf="!isLoading && !isSuccess">LOGIN</ng-container>
            <ng-container *ngIf="isLoading">
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              Processing...
            </ng-container>
            <ng-container *ngIf="isSuccess">Success ✓</ng-container>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<app-password-mgmt
  *ngIf="showForgotModal"
  [mode]="modalMode"
  (close)="showForgotModal = false"
></app-password-mgmt>
