<div class="user-management-flat-wrapper animate-fade-in">
  <!-- Header -->

  <div class="page-header-section mt-3">
    <h4 class="text-white m-0 fw-bold">Undo Cheque Reader Report</h4>

    <div class="d-flex justify-content-between gap-3">
      <button class="btn btn-flat-action-primary" (click)="onGenerate()">
        <i class="bi bi-clipboard2-data-fill"></i>
        Generate Report
      </button>

      <button class="btn btn-flat-action-danger-outline" (click)="onCancel()">
        <i class="bi bi-arrow-clockwise"></i>
        Reset
      </button>
    </div>
  </div>

  <div class="main-scrollable-content-fluid">
    <!-- Selection Criteria -->

    <div class="receipt-form-card">
      <div class="row g-3">
        <div class="col-12">
          <h6>Selection Criteria</h6>
        </div>

        <div class="col-md-3">
          <app-date-picker label="From Date" [(value)]="reportForm.fromDate" helperText="">
          </app-date-picker>
        </div>

        <div class="col-md-3">
          <app-date-picker label="To Date" [(value)]="reportForm.toDate" helperText="">
          </app-date-picker>
        </div>
      </div>
    </div>

    <div class="receipt-form-card mt-3">
      <div class="col-12 d-flex justify-content-end">
        <button
          class="btn btn-flat-action-primary-fill mb-3"
          [disabled]="gridData.length <= 0"
          (click)="onDownloadClick()"
        >
          <i class="bi bi-cloud-arrow-down-fill"></i>
          Export to Excel
        </button>
      </div>

      <app-data-grid
        [records]="gridData"
        [columns]="gridColumns"
        [showAction]="false"
        [isServerSide]="true"
        [tableHeight]="'535px'"
      >
      </app-data-grid>
    </div>
  </div>
</div>
