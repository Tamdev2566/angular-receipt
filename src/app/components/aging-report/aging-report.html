<div class="user-management-flat-wrapper animate-fade-in">
  <!-- Header -->

  <div class="page-header-section mt-3">
    <h4 class="text-white m-0 fw-bold">Aging Report</h4>

    <div class="d-flex justify-content-between gap-3">
      <button class="btn btn-flat-action-primary" (click)="generateReport()">
        <i class="bi bi-clipboard2-data-fill"></i>
        Generate Report
      </button>

      <button class="btn btn-flat-action-danger-outline" (click)="onCancel()">
        <i class="bi bi-arrow-clockwise"></i>
        Reset
      </button>
    </div>
  </div>

  <div class="main-scrollable-content-fluid p-4">
    <!-- Selection Criteria -->

    <div class="receipt-form-card">
      <div class="row g-3 align-items-end">
        <div class="col-12">
          <h6>Selection Criteria</h6>
        </div>

        <div class="col-md-4">
          <label class="form-label custom-flat-label"> Aging Report of Days : </label>

          <app-combobox
            displayExpr="name"
            valueExpr="id"
            [(value)]="formData.agingDays"
            [data]="agingDayList"
            [onChange]="onAgingChange.bind(this)"
          >
          </app-combobox>
        </div>
      </div>
    </div>

    <div class="receipt-form-card mt-3">
      <div class="col-12 d-flex justify-content-end">
        <button
          class="btn btn-flat-action-primary-fill mb-3"
          (click)="onDownloadClick()"
          [disabled]="gridData.length <= 0"
        >
          <i class="bi bi-cloud-arrow-down-fill"></i>
          Export to Excel
        </button>
      </div>

      <app-data-grid
        [records]="gridData"
        [columns]="gridColumns"
        [showAction]="false"
        [isServerSide]="true"
        [tableHeight]="'535px'"
      >
      </app-data-grid>
    </div>
  </div>
</div>
