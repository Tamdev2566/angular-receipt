<div class="user-management-flat-wrapper animate-fade-in">
  <div class="page-header-section mt-3">
    <h4 class="text-white m-0 fw-bold">Print Report</h4>

    <div class="d-flex justify-content-between gap-3">
      <button class="btn btn-flat-action-primary" (click)="retrieveReport()">
        <i class="bi bi-clipboard2-data-fill"></i>
        Generate Report
      </button>

      <button class="btn btn-flat-action-danger-outline" (click)="onCancel()">
        <i class="bi bi-arrow-clockwise"></i>
        Reset
      </button>
    </div>
  </div>

  <div class="main-scrollable-content-fluid">
    <div class="receipt-form-card">
      <div class="row g-3">
        <div class="col-12">
          <h6>Retrieve By</h6>
        </div>

        <!-- Transaction Date -->
        <div class="col-md-3">
          <label class="form-label fw-bold custom-flat-label mb-1.5">
            Transaction Date: <span class="required text-danger">*</span>
          </label>
          <app-date-picker
            [required]="true"
            helperText="Select transaction date"
            [error]="transactionDateErr"
            [(value)]="transactionDate"
            (valueChange)="transactionDateErr = false"
          >
          </app-date-picker>
        </div>

        <!-- Payment Mode -->
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label fw-bold custom-flat-label mb-1.5">
            Payment Mode: <span class="required text-danger">*</span>
          </label>
          <app-combobox
            displayExpr="name"
            valueExpr="id"
            name="paymentMode"
            [data]="paymentTypes"
            [class.input-error]="paymentModeErr"
            [onChange]="onPaymentChange.bind(this)"
          >
          </app-combobox>
          <small *ngIf="paymentModeErr" class="text-danger error-text">
            Payment Mode is required
          </small>
        </div>

        <!-- Currency -->
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label fw-bold custom-flat-label mb-1.5">
            Currency: <span class="required text-danger">*</span>
          </label>
          <app-combobox
            displayExpr="name"
            valueExpr="id"
            name="currency"
            [data]="currency"
            [class.input-error]="currencyErr"
            [onChange]="onCurrencyChange.bind(this)"
          >
          </app-combobox>
          <small *ngIf="currencyErr" class="text-danger error-text"> Currency is required </small>
        </div>

        <!-- Report For -->
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label fw-bold custom-flat-label mb-1.5">
            Report For: <span class="required text-danger">*</span>
          </label>
          <app-combobox
            [url]="'api/users/getUsers'"
            [responsePath]="'data'"
            displayExpr="userName"
            valueExpr="userId"
            name="reportFor"
            [class.input-error]="reportForErr"
            [onChange]="onReportForChange.bind(this)"
            [searchFromApi]="false"
          >
          </app-combobox>
          <small *ngIf="reportForErr" class="text-danger error-text">
            Report For is required
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
