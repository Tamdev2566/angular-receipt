@if (isOpen) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fa-solid fa-list-check me-2 text-primary"></i>
          Outstanding Invoices
        </h5>
        <button type="button" class="btn-close-flat" (click)="close()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Customer Subheader -->
      @if (customerName) {
        <div class="modal-subheader"><span class="fw-bold">Customer:</span> {{ customerName }}</div>
      }

      <!-- Modal Body / DataGrid -->
      <div class="modal-body">
        <!-- @if (records && records.length > 0) { -->
        <app-data-grid
          [records]="records"
          [columns]="columns"
          [showAction]="false"
          [tableHeight]="'350px'"
        >
        </app-data-grid>
        <!-- } -->
      </div>

      <!-- Modal Footer
      <div class="modal-footer">
        <button type="button" class="btn btn-flat-action-danger" (click)="close()">Cancel</button>
        <button
          type="button"
          class="btn btn-flat-action-primary-fill"
          [disabled]="selectedRows.length === 0"
          (click)="confirmSelection()"
        >
          <i class="fa-solid fa-check me-1"></i>
          Apply Selected ({{ selectedRows.length }})
        </button>
      </div> -->
    </div>
  </div>
}
