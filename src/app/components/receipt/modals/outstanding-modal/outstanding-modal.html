@if (isOpen) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fa-solid fa-list-check me-2 text-primary"></i>
          Outstanding Invoices
        </h5>
        <button type="button" class="btn-close-flat" (click)="close()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      @if (customerName) {
        <div class="modal-subheader"><span class="fw-bold">Customer:</span> {{ customerName }}</div>
      }

      <div class="modal-body">
        <app-data-grid
          [records]="records"
          [columns]="columns"
          [showAction]="false"
          [tableHeight]="'450px'"
        >
        </app-data-grid>
      </div>
    </div>
  </div>
}
