<div class="container-fluid">
  <!-- RETRIEVE -->
  <fieldset class="border rounded-3 p-3 mb-4">
    <legend
      class="float-none w-auto px-2 fs-6 fw-bold text-secondary mb-0"
      style="font-size: 0.8rem !important; letter-spacing: 0.5px"
    >
      RETRIEVE BY
    </legend>

    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1"> Customer Name : </label>

        <input type="text" class="form-control" [(ngModel)]="inputCustomer" />
      </div>

      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1"> Vessel Name : </label>

        <input type="text" class="form-control" [(ngModel)]="inputVessel" />
      </div>

      <div class="col-md-3">
        <label class="form-label text-secondary small fw-bold mb-1"> Voyage Number : </label>

        <input type="text" class="form-control" [(ngModel)]="inputVoyage" />
      </div>

      <div class="col-md-3">
        <button class="btn btn-dark w-100 fw-bold" (click)="retrieveRemoveModalData()">
          Retrieve Matches
        </button>
      </div>
    </div>
  </fieldset>

  <!-- INVOICE DETAILS -->

  <fieldset class="border rounded-3 p-3 mb-4">
    <legend
      class="float-none w-auto px-2 fs-6 fw-bold text-secondary mb-0"
      style="font-size: 0.8rem !important; letter-spacing: 0.5px"
    >
      INVOICE DETAILS
    </legend>

    <app-data-grid
      [records]="matches"
      [columns]="invoiceColumns"
      [showAction]="false"
      [tableHeight]="'260px'"
    >
    </app-data-grid>
  </fieldset>

  <!-- REMARK -->

  <fieldset class="border rounded-3 p-3">
    <legend
      class="float-none w-auto px-2 fs-6 fw-bold text-secondary mb-0"
      style="font-size: 0.8rem !important; letter-spacing: 0.5px"
    >
      REMARK DETAILS
    </legend>

    <div class="row align-items-end">
      <div class="col-md-8">
        <label class="form-label text-secondary small fw-bold mb-1"> Removal Reason : </label>

        <input
          class="form-control"
          [(ngModel)]="removalRemark"
          placeholder="Enter removal reason"
        />
      </div>

      <div class="col-md-4">
        <div class="d-flex justify-content-end gap-2">
          <button
            class="btn text-white fw-bold px-4"
            style="background: #e91e63; border-color: #e91e63"
            (click)="commitRemove()"
          >
            Remove Invoice
          </button>

          <button class="btn btn-outline-secondary" (click)="onClose()">Cancel</button>
        </div>
      </div>
    </div>
  </fieldset>
</div>
