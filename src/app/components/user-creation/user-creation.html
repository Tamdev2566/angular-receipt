
<div class="receipt-container container-fluid p-0">
  
  <div class="welcome-banner-wrapper mb-3 p-3 py-2.5 d-flex justify-content-between align-items-center">
    <div>
      <h5 class="text-header fw-bold mb-0 tracking-tight fs-5">User Directory Management</h5>
    </div>
    <button class="btn btn-create-receipt px-3 py-1.5 slim-banner-btn" (click)="openCreateUserModal()">
      <i class="fa-solid fa-user-plus me-1.5 small"></i> Create User
    </button>
  </div>

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-2 align-content-start" *ngIf="usersList.length > 0">
  <div class="col" *ngFor="let user of usersList">
    
    <div class="card h-100 rounded-3 shadow-none transition-card metric-glass-card custom-user-compact-card">
      <div class="card-body p-3 d-flex flex-column justify-content-between" style="min-height: 180px; gap: 10px">
        
        <div class="d-flex justify-content-between align-items-start">
          <div class="d-flex align-items-center gap-2">
            <!-- <div class="avatar-circle-ui d-flex align-items-center justify-content-center text-white fw-bold">
              {{ user?.userName ? (user.userName | slice:0:1 | uppercase) : '' }}
            </div> -->
            <div style="line-height: 1.2; max-width: 140px;">
              <h6 class="card-title m-0 text-truncate text-white font-normal-title" style="font-size: 0.8rem !important;">
                {{ user.userName }}
              </h6>
              <small class="font-monospace mint-text" style="font-size: 0.62rem;">ID: {{ user.userId }}</small>
            </div>
          </div>
        </div>

        <div class="inner-info-table rounded p-2 d-flex flex-column gap-1.5" style="font-size: 0.68rem;">
          <div class="d-flex justify-content-between align-items-center">
            <span class="text-white-50">Code</span>
            <span class="text-white font-normal text-truncate ms-2" style="max-width: 90px;">{{ user.userCode }}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="text-white-50">Status</span>
            <span class="badge bg-success-light text-success-bright border-white-10 font-normal" style="font-size: 0.6rem; padding: 2px 6px;">Active</span>
          </div>
        </div>

        <div class="pt-1.5 border-top border-white-10 text-end">
          <button (click)="deleteUserAccount(user)" class="btn btn-danger btn-sm core-action-card-btn-danger w-100" style="height: 28px; font-size: 0.62rem; padding: 2px 0;">
            Remove User
          </button>
        </div>

      </div>
    </div>

  </div>
</div>

  <div *ngIf="usersList.length === 0" class="no-records-glass p-5 text-center my-5 d-flex flex-column align-items-center justify-content-center rounded-3">
    <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 48px; height: 48px; background-color: rgba(252, 238, 167, 0.2)">
      <i class="fa-solid fa-users-slash text-warning fs-4"></i>
    </div>
    <h6 class="fw-bold text-white m-0">No Registered Users Database Records Found</h6>
  </div>

</div>

<div class="custom-modal-backdrop-overlay" *ngIf="isModalOpen" (click)="closeCreateUserModal()">
  <div class="custom-modal-dialog-card bg-white rounded-4 shadow-lg p-4" (click)="$event.stopPropagation()">
    
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom border-light">
      <h5 class="fw-bold text-dark m-0" style="color: #32325d !important">Create New User Profile</h5>
      <button class="btn-close shadow-none" (click)="closeCreateUserModal()"></button>
    </header>

    <form #registerForm="ngForm" (ngSubmit)="onRegister(registerForm)" autocomplete="off">
      <div class="row g-3 align-items-start mb-4">
        
        <div class="col-12 col-md-6">
          <label class="form-label text-muted fw-bold text-uppercase m-0 mb-1" style="font-size: 0.65rem">User ID:</label>
          <input type="text" name="uid" [(ngModel)]="regData.userId" #userId="ngModel" class="form-control form-control-sm text-secondary border-slate custom-input-field" placeholder="Enter User ID" required />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label text-muted fw-bold text-uppercase m-0 mb-1" style="font-size: 0.65rem">User Code:</label>
          <input type="text" name="ucode" [(ngModel)]="regData.userCode" #userCode="ngModel" class="form-control form-control-sm text-secondary border-slate custom-input-field" placeholder="Enter User Code" required />
        </div>

        <div class="col-12">
          <label class="form-label text-muted fw-bold text-uppercase m-0 mb-1" style="font-size: 0.65rem">User Name:</label>
          <input type="text" name="uname" [(ngModel)]="regData.userName" #userName="ngModel" class="form-control form-control-sm text-secondary border-slate custom-input-field" placeholder="Enter Full Name" required />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label text-muted fw-bold text-uppercase m-0 mb-1" style="font-size: 0.65rem">Password:</label>
          <input type="password" name="pwd" [(ngModel)]="regData.password" #passwordField="ngModel" class="form-control form-control-sm text-secondary border-slate custom-input-field" placeholder="Enter Password" required minlength="6" />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label text-muted fw-bold text-uppercase m-0 mb-1" style="font-size: 0.65rem">Confirm Password:</label>
          <input type="password" name="cpwd" [(ngModel)]="regData.confirmPassword" #confirmField="ngModel" class="form-control form-control-sm text-secondary border-slate custom-input-field" placeholder="Re-enter Password" required />
          <div class="error-text text-danger mt-1" style="font-size: 0.65rem;" *ngIf="passwordMismatch && formSubmitted">Passwords mismatch!</div>
        </div>

      </div> <div class="d-flex justify-content-end gap-2 pt-3 border-top border-light">
        <button type="button" class="btn btn-light btn-sm px-3 text-secondary" style="height: 34px;" (click)="closeCreateUserModal()">Cancel</button>
        <button type="submit" class="btn text-header fw-bold px-4 btn-sm" [disabled]="isSaving" style="height: 34px; background: #2dce89; border-radius: 0.375rem;">
          <span *ngIf="!isSaving">Save Profile</span>
          <span *ngIf="isSaving"><i class="fa-solid fa-circle-notch fa-spin me-1"></i> Saving...</span>
        </button>
      </div>
    </form>

  </div>
</div>
