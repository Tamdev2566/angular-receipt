<div
  class="container-fluid p-0 min-vh-100 d-flex align-items-center justify-content-center"
  style="background: linear-gradient(135deg, #f0f4f8 0%, #d9e8f5 100%)"
>
  <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 460px">
    <!-- Header -->
    <div
      class="card-header border-0 rounded-top-4 py-4 px-4 text-white text-center"
      style="background: linear-gradient(135deg, #33708f 0%, #4a91b8 100%)"
    >
      <i class="fa-solid fa-lock-open fs-2 mb-2 d-block"></i>
      <h5 class="fw-bold mb-1">
        {{ isForced ? 'Password Expired — Update Required' : 'Change Password' }}
      </h5>
      <small *ngIf="isForced" class="opacity-75">
        Your password is over 90 days old. Please set a new password to continue.
      </small>
    </div>

    <!-- Form -->
    <div class="card-body px-4 py-4">
      <form #pwdForm="ngForm" (ngSubmit)="onSubmit(pwdForm)" autocomplete="off" novalidate>
        <!-- Current password -->
        <div class="mb-3">
          <label class="form-label fw-semibold small">Current Password</label>
          <div class="input-group">
            <input
              [type]="showOld ? 'text' : 'password'"
              class="form-control"
              name="oldPassword"
              [(ngModel)]="oldPassword"
              required
              placeholder="Enter current password"
              autocomplete="current-password"
            />
            <button type="button" class="btn btn-outline-secondary" (click)="showOld = !showOld">
              <i class="fa-solid" [ngClass]="showOld ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- New password -->
        <div class="mb-3">
          <label class="form-label fw-semibold small">New Password</label>
          <div class="input-group">
            <input
              [type]="showNew ? 'text' : 'password'"
              class="form-control"
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              minlength="8"
              placeholder="Min 8 chars, upper + lower + number + special"
              autocomplete="new-password"
            />
            <button type="button" class="btn btn-outline-secondary" (click)="showNew = !showNew">
              <i class="fa-solid" [ngClass]="showNew ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <!-- Strength indicator -->
          <div class="mt-1" *ngIf="newPassword">
            <small [class]="passwordStrengthOk ? 'text-success' : 'text-danger'">
              <i
                class="fa-solid me-1"
                [ngClass]="passwordStrengthOk ? 'fa-circle-check' : 'fa-circle-xmark'"
              ></i>
              {{
                passwordStrengthOk
                  ? 'Password meets requirements'
                  : 'Needs uppercase, lowercase, number & special char'
              }}
            </small>
          </div>
        </div>

        <!-- Confirm password -->
        <div class="mb-4">
          <label class="form-label fw-semibold small">Confirm New Password</label>
          <div class="input-group">
            <input
              [type]="showConfirm ? 'text' : 'password'"
              class="form-control"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder="Re-enter new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="showConfirm = !showConfirm"
            >
              <i class="fa-solid" [ngClass]="showConfirm ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <small
            class="text-danger mt-1 d-block"
            *ngIf="submitted && confirmPassword && newPassword !== confirmPassword"
          >
            Passwords do not match.
          </small>
        </div>

        <!-- Actions -->
        <div class="d-grid gap-2">
          <button
            type="submit"
            class="btn text-white fw-bold py-2 rounded-pill"
            [disabled]="loading"
            style="background: linear-gradient(135deg, #33708f 0%, #4a91b8 100%)"
          >
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ loading ? 'Saving...' : 'Change Password' }}
          </button>

          <button
            *ngIf="!isForced"
            type="button"
            class="btn btn-outline-secondary rounded-pill"
            (click)="onSkip()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
