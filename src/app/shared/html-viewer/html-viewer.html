<div #modalRef class="modal fade" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <!-- Header -->
      <div class="modal-header bg-light py-2">
        <h6 class="modal-title fw-bold text-secondary">Document Preview</h6>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-0">
        <iframe #iframeRef class="w-100 border-0" style="height: 75vh"></iframe>
      </div>

      <!-- Footer -->
      <div class="modal-footer bg-light py-2">
        <button type="button" class="btn btn-secondary btn-sm" (click)="closeModal()">Close</button>
        <button
          type="button"
          class="btn btn-primary btn-sm d-flex align-items-center gap-1"
          (click)="printDocument()"
        >
          <i class="bi bi-printer"></i> Print
        </button>
      </div>
    </div>
  </div>
</div>
