<div class="table-responsive rounded-3 border shadow-sm" style="overflow-x: auto">
  <table class="table table-hover align-middle mb-0" style="min-width: 800px">
    <thead>
      <tr>
        <th
          *ngIf="showCheckbox()"
          class="text-center"
          style="width: 50px; background: #33708f; color: white"
        >
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="isAllSelected()"
            (change)="toggleAllRows($event)"
          />
        </th>

        <th
          *ngFor="let col of columns()"
          [style.width]="col.width"
          [ngClass]="col.align ? 'text-' + col.align : ''"
          style="background: #33708f; color: white"
        >
          {{ col.label }}
        </th>

        <th
          *ngIf="showAction()"
          class="text-center"
          style="
            width: 150px;
            background: #33708f;
            color: white;
            position: sticky;
            right: 0;
            z-index: 2;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
          "
        >
          Actions
        </th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of pagedRecords()">
        <td *ngIf="showCheckbox()" class="text-center">
          <input
            type="checkbox"
            class="form-check-input"
            [(ngModel)]="row.isSelected"
            (change)="onRowSelect()"
          />
        </td>

        <td *ngFor="let col of columns()" [ngClass]="col.align ? 'text-' + col.align : ''">
          <ng-container [ngSwitch]="col.type">
            <span *ngSwitchCase="'badge'" class="badge bg-primary">{{ row[col.field] }}</span>
            <span *ngSwitchDefault>{{ row[col.field] }}</span>
          </ng-container>
        </td>

        <td
          *ngIf="showAction()"
          class="text-center"
          style="
            position: sticky;
            right: 0;
            background-color: #fff;
            z-index: 1;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.05);
          "
        >
          <ng-container
            *ngTemplateOutlet="actionTemplate(); context: { $implicit: row }"
          ></ng-container>
        </td>
      </tr>

      <tr *ngIf="records().length === 0">
        <td [attr.colspan]="totalColSpan()" class="text-center py-4 text-muted">
          No records found
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="totalPages() > 1" class="d-flex justify-content-between align-items-center mt-3">
  <div>Page {{ currentPage() }} of {{ totalPages() }}</div>

  <ul class="pagination pagination-sm mb-0">
    <li class="page-item" [class.disabled]="currentPage() === 1">
      <button type="button" class="page-link" (click)="changePage(currentPage() - 1)">
        &laquo;
      </button>
    </li>

    <li
      *ngFor="let page of pageNumbers()"
      class="page-item"
      [class.active]="currentPage() === page"
    >
      <button type="button" class="page-link" (click)="changePage(page)">
        {{ page }}
      </button>
    </li>

    <li class="page-item" [class.disabled]="currentPage() === totalPages()">
      <button type="button" class="page-link" (click)="changePage(currentPage() + 1)">
        &raquo;
      </button>
    </li>
  </ul>
</div>
