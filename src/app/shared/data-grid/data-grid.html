<div
  class="table-responsive rounded-3 border shadow-sm"
  [style.max-height]="tableHeight()"
  style="overflow: auto"
>
  <table class="table table-hover align-middle mb-0 table-fixed-header" style="min-width: 800px">
    <thead>
      <tr>
        <th *ngIf="showCheckbox()" class="text-center" style="width: 50px">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="isAllSelected()"
            (change)="toggleAllRows($event)"
          />
        </th>

        <th
          *ngFor="let col of columns()"
          [style.width]="col.width"
          [ngClass]="col.align ? 'text-' + col.align : ''"
        >
          {{ col.label }}
        </th>

        <th *ngIf="showAction()" class="text-center sticky-action-th" style="width: 150px">
          Actions
        </th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of pagedRecords()">
        <td *ngIf="showCheckbox()" class="text-center">
          <input
            type="checkbox"
            class="form-check-input"
            [(ngModel)]="row.isSelected"
            (change)="onRowSelect()"
          />
        </td>

        <td *ngFor="let col of columns()" [ngClass]="col.align ? 'text-' + col.align : ''">
          <ng-container [ngSwitch]="col.type">
            <span *ngSwitchCase="'checkbox'" class="d-flex justify-content-center">
              <input
                type="checkbox"
                class="form-check-input"
                [checked]="
                  row[col.field] === '0' || row[col.field] === 0 || row[col.field] === true
                "
                disabled
              />
            </span>
            <span *ngSwitchCase="'badge'" class="badge bg-primary">{{ row[col.field] }}</span>
            <span *ngSwitchDefault>{{ row[col.field] }}</span>
          </ng-container>
        </td>

        <td *ngIf="showAction()" class="text-center sticky-action-td">
          <ng-container
            *ngTemplateOutlet="actionTemplate(); context: { $implicit: row }"
          ></ng-container>
        </td>
      </tr>

      <tr *ngIf="records().length === 0">
        <td
          [attr.colspan]="totalColSpan()"
          class="text-center py-4 text-muted"
          style="color: #33708f !important"
        >
          No records found
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="totalPages() > 1" class="d-flex justify-content-between align-items-center m-3">
  <div class="text-muted small">
    Page <strong>{{ currentPage() }}</strong> of <strong>{{ totalPages() }}</strong>
  </div>

  <ul class="pagination pagination-sm mb-0 custom-brand-pagination">
    <li class="page-item" [class.disabled]="currentPage() === 1">
      <button type="button" class="page-link" (click)="changePage(currentPage() - 1)">
        &laquo;
      </button>
    </li>

    <li
      *ngFor="let page of visiblePages()"
      class="page-item"
      [class.active]="currentPage() === page"
      [class.disabled]="page === '...'"
    >
      <button type="button" class="page-link" (click)="changePage(page)">
        {{ page }}
      </button>
    </li>

    <li class="page-item" [class.disabled]="currentPage() === totalPages()">
      <button type="button" class="page-link" (click)="changePage(currentPage() + 1)">
        &raquo;
      </button>
    </li>
  </ul>
</div>
